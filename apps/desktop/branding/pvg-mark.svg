<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="PVG AI">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1F3A"/>
      <stop offset="55%" stop-color="#0E4D8B"/>
      <stop offset="100%" stop-color="#1EC8FF"/>
    </linearGradient>
    <linearGradient id="peak" x1="0.2" y1="0.1" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#E8F7FF"/>
      <stop offset="45%" stop-color="#7DD3FC"/>
