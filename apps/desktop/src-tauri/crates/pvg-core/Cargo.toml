[package]
name = "pvg-core"
version = "0.1.0"
edition = "2021"
description = "PVG AI native core — path security, project format, typed errors (no Tauri/GTK)"
rust-version = "1.77"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde", "clock"] }

[dev-dependencies]
tempfile = "3"
