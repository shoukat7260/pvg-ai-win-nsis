[workspace]
members = [".", "crates/pvg-core", "crates/pvg-vault", "crates/pvg-media"]
resolver = "2"

[package]
name = "pvg-desktop"
version = "0.1.0"
description = "PVG AI desktop native core (Phase 3 media + Phase 2 vault)"
authors = ["PVG AI"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "pvg_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
pvg-core = { path = "crates/pvg-core" }
pvg-vault = { path = "crates/pvg-vault" }
pvg-media = { path = "crates/pvg-media" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
parking_lot = "0.12"
dirs = "6"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
