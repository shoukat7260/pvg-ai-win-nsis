[package]
name = "pvg-vault"
version = "0.1.0"
edition = "2021"
description = "PVG AI credential vault (memory + OS keyring)"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["clock"] }
parking_lot = "0.12"
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
